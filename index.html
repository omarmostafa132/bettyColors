<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>bettyshop · Admin Panel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
body{background:#f4f6f1;color:#22352A;padding-bottom:90px}
h1,h2,h3,.btn{font-family:'Outfit',sans-serif}
.top{background:#fff;border-bottom:1px solid #e3e6dc;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;flex:1;display:flex;align-items:center;gap:9px}
.top a{font-size:13px;color:#317244;text-decoration:none;font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e3e6dc;border-radius:16px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:#52624F;margin-bottom:12px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:1px solid #e3e6dc;background:#fff;border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:500}
.sw{display:inline-flex}.sw i{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:1px solid rgba(0,0,0,.12);display:block}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.colors{grid-template-columns:1fr}}
.color{display:flex;align-items:center;gap:10px;border:1px solid #e3e6dc;border-radius:12px;padding:8px 10px}
.color input{width:38px;height:38px;border:none;padding:0;background:none;cursor:pointer;border-radius:8px;flex:0 0 auto}
.color label{font-size:13px;font-weight:500;line-height:1.25;flex:1}
.color small{display:block;color:#7a8776;font:400 11px monospace}
.slide{border:1px solid #e3e6dc;border-radius:12px;padding:10px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.slide img{width:70px;height:92px;border-radius:8px;object-fit:cover;background:#eef0e8;border:1px solid #e3e6dc;flex:0 0 auto}
.fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.fields b{font:600 14px 'Outfit',sans-serif}
.in{width:100%;border:1px solid #d5d9cc;border-radius:9px;padding:9px 10px;font-size:13px;outline:none}
.in:focus{border-color:#317244}
.upload{font-size:13px;padding:8px;border-radius:9px;border:1px dashed #317244;color:#317244;background:#f6f8f3;cursor:pointer;text-align:center;font-weight:500}
.clear{background:none;border:none;color:#b4403f;font-size:12px;cursor:pointer;text-align:left}
/* live preview (scoped variables) */
.preview{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--white);color:var(--text-main)}
.pv-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--white)}
.pv-head i{color:var(--green-dark)}
.pv-head b{font:700 15px 'Outfit',sans-serif}
.pv-bar{background:var(--green-dark);color:var(--white);font-size:12px;padding:5px 14px}
.pv-hero{height:130px;background:#ddd center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.pv-cta{background:var(--green-dark);color:var(--white);padding:8px 20px;border-radius:8px;font:600 13px 'Outfit',sans-serif}
.pv-grid{display:flex;gap:10px;padding:12px;background:var(--green-light)}
.pv-prod{flex:1;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px}
.pv-prod .img{height:44px;border-radius:6px;background:var(--accent-soft);margin-bottom:8px}
.pv-prod .price{color:var(--price-pink);font-weight:700}
.pv-prod .muted{color:var(--text-muted);font-size:11px}
.pv-prod .tag{display:inline-block;margin-top:6px;background:var(--accent);color:var(--green-deep);border-radius:6px;padding:2px 8px;font-size:11px}
.pv-prod .hov{margin-top:6px;background:var(--green-main);color:var(--white);border-radius:6px;padding:3px 8px;font-size:11px;display:inline-block}
.pv-soft{background:var(--green-soft);padding:8px 14px;font-size:12px;color:var(--text-muted)}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e6dc;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.foot .in-foot{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.status{flex:1;font-size:12.5px;color:#317244;min-width:0}.status.err{color:#b4403f}
.btn{padding:12px 20px;border-radius:12px;border:1px solid #317244;font-size:14px;font-weight:600;cursor:pointer}
.btn.primary{background:#317244;color:#fff}.btn.ghost{background:#fff;color:#317244}
.btn:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<div class="top">
    <h1><i class="fas fa-sliders-h"></i> Admin Panel</h1>
    <a href="bettyshop.html" target="_blank">View website <i class="fas fa-external-link-alt"></i></a>
</div>

<div class="wrap">
    <div class="card">
        <h2>Preview</h2>
        <div class="preview" id="preview">
            <div class="pv-head"><i class="fas fa-bars"></i><b>bettyshop</b><i class="fas fa-shopping-bag"></i></div>
            <div class="pv-bar">Hijab | Scarves | Shawls</div>
            <div class="pv-hero" id="pvHero"><span class="pv-cta">Shop Now</span></div>
            <div class="pv-grid">
                <div class="pv-prod"><div class="img"></div><b>Silk scarf</b><div class="muted">Soft &amp; light</div><div class="price">350 EGP</div><span class="tag">New</span></div>
                <div class="pv-prod"><div class="img"></div><b>Cotton hijab</b><div class="muted">Everyday</div><div class="price">180 EGP</div><span class="hov">Hover</span></div>
            </div>
            <div class="pv-soft">Soft background section</div>
        </div>
    </div>

    <div class="card">
        <h2>Quick palettes</h2>
        <div class="presets" id="presets"></div>
    </div>

    <div class="card">
        <h2>Website colors</h2>
        <div class="colors" id="colors"></div>
    </div>

    <div class="card">
        <h2>Hero banner photos</h2>
        <div id="slides"></div>
    </div>
</div>

<div class="foot"><div class="in-foot">
    <div class="status" id="status"></div>
    <button class="btn ghost" id="resetBtn">Reset</button>
    <button class="btn primary" id="saveBtn">Save changes</button>
</div></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDexampleAPIKeyForFirebase",   // <-- paste your real config (same as the website)
    authDomain: "betty-6a836.firebaseapp.com",
    databaseURL: "https://betty-6a836-default-rtdb.firebaseio.com",
    projectId: "betty-6a836",
    storageBucket: "betty-6a836.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:exampleappid"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const DEFAULT_COLORS = {
    '--green-dark':'#317244','--green-main':'#4A6B54','--green-deep':'#22352A',
    '--green-light':'#ffffff','--green-soft':'#ffffff','--accent':'#E8A79E',
    '--accent-soft':'#F2CFC9','--price-pink':'#c92246','--text-main':'#22352A',
    '--text-muted':'#52624F','--white':'#ffffff','--border':'#C8CFC0'
};
const LABELS = {
    '--green-dark':'Main color (buttons, icons)','--green-main':'Hover / secondary','--green-deep':'Deepest shade',
    '--green-light':'Light background','--green-soft':'Soft background','--accent':'Accent',
    '--accent-soft':'Accent (soft)','--price-pink':'Price color','--text-main':'Main text',
    '--text-muted':'Muted text','--white':'Page background','--border':'Borders'
};
const PRESETS = {
    'Default green': DEFAULT_COLORS,
    'Rose': {'--green-dark':'#9d3b5a','--green-main':'#b9577a','--green-deep':'#4a1a2b','--green-light':'#fff5f7','--green-soft':'#fde8ee','--accent':'#f4a6b8','--accent-soft':'#fbd5de','--price-pink':'#c92246','--text-main':'#3b1a25','--text-muted':'#7a5561','--white':'#ffffff','--border':'#ecd3da'},
    'Ocean': {'--green-dark':'#1f5f8b','--green-main':'#3a7ca5','--green-deep':'#10324a','--green-light':'#f3f9fd','--green-soft':'#e1eff8','--accent':'#f2b880','--accent-soft':'#f9dcc0','--price-pink':'#c92246','--text-main':'#10324a','--text-muted':'#506a7c','--white':'#ffffff','--border':'#cfdde7'},
    'Lavender': {'--green-dark':'#6b4fa0','--green-main':'#8468b8','--green-deep':'#2e2147','--green-light':'#f8f5fd','--green-soft':'#ece5f8','--accent':'#e8a79e','--accent-soft':'#f2cfc9','--price-pink':'#c92246','--text-main':'#2e2147','--text-muted':'#6b6080','--white':'#ffffff','--border':'#dcd3ec'},
    'Dark': {'--green-dark':'#d9b26f','--green-main':'#c29a52','--green-deep':'#f2e6cc','--green-light':'#1d1d1d','--green-soft':'#262626','--accent':'#d98d83','--accent-soft':'#3a2a28','--price-pink':'#ff6b86','--text-main':'#f2f2f2','--text-muted':'#b5b5b5','--white':'#121212','--border':'#333333'}
};
const DEFAULT_HERO = 'https://i.postimg.cc/s2pp2XPd/4ab200b3-95c9-4009-a343-243414d1517a.jpg';

const $ = id => document.getElementById(id);
const preview = $('preview');
let draft = { colors:{}, hero:['','',''] };

function msg(t, err){ $('status').textContent = t || ''; $('status').classList.toggle('err', !!err); }
function col(k){ return draft.colors[k] || DEFAULT_COLORS[k]; }

function refreshPreview(){
    Object.keys(DEFAULT_COLORS).forEach(k => preview.style.setProperty(k, col(k)));
    $('pvHero').style.backgroundImage = 'url("' + (draft.hero[0] || DEFAULT_HERO) + '")';
}

function buildColors(){
    $('colors').innerHTML = '';
    Object.keys(DEFAULT_COLORS).forEach(k => {
        const row = document.createElement('div');
        row.className = 'color';
        row.innerHTML = '<input type="color" value="'+col(k)+'"><label>'+LABELS[k]+'<small>'+col(k)+'</small></label>';
        row.querySelector('input').addEventListener('input', function(){
            draft.colors[k] = this.value;
            row.querySelector('small').textContent = this.value;
            refreshPreview();
        });
        $('colors').appendChild(row);
    });
}

function buildPresets(){
    Object.keys(PRESETS).forEach(name => {
        const p = PRESETS[name], b = document.createElement('button');
        b.className = 'preset';
        b.innerHTML = '<span class="sw"><i style="background:'+p['--green-dark']+'"></i><i style="background:'+p['--accent']+'"></i><i style="background:'+p['--white']+'"></i></span>'+name;
        b.addEventListener('click', () => { draft.colors = Object.assign({}, p); buildColors(); refreshPreview(); });
        $('presets').appendChild(b);
    });
}

function resize(file, maxSide, q){
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onerror = rej;
        r.onload = () => {
            const img = new Image();
            img.onerror = rej;
            img.onload = () => {
                const s = Math.min(1, maxSide / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                res(c.toDataURL('image/jpeg', q));
            };
            img.src = r.result;
        };
        r.readAsDataURL(file);
    });
}

function buildSlides(){
    $('slides').innerHTML = '';
    for(let i = 0; i < 3; i++){
        const v = draft.hero[i] || '';
        const row = document.createElement('div');
        row.className = 'slide';
        row.innerHTML = '<img alt=""><div class="fields"><b>Slide '+(i+1)+'</b>'+
            '<input type="url" class="in" placeholder="Image URL (https://...)">'+
            '<label class="upload">Upload photo<input type="file" accept="image/*" hidden></label>'+
            '<button class="clear" type="button">Use original photo</button></div>';
        const img = row.querySelector('img'), txt = row.querySelector('input[type=url]'), file = row.querySelector('input[type=file]');
        img.src = v || DEFAULT_HERO;
        txt.value = v.startsWith('data:') ? '(uploaded photo)' : v;
        txt.addEventListener('input', () => { draft.hero[i] = txt.value.trim(); img.src = draft.hero[i] || DEFAULT_HERO; refreshPreview(); });
        file.addEventListener('change', () => {
            const f = file.files[0]; if(!f) return;
            msg('Processing image...');
            resize(f, 1400, 0.82).then(d => {
                draft.hero[i] = d; img.src = d; txt.value = '(uploaded photo)';
                refreshPreview(); msg('Photo ready — press Save to publish.');
            }).catch(() => msg('Could not read that image.', true));
        });
        row.querySelector('.clear').addEventListener('click', () => { draft.hero[i] = ''; img.src = DEFAULT_HERO; txt.value = ''; refreshPreview(); });
        $('slides').appendChild(row);
    }
}

function render(){ buildColors(); buildSlides(); refreshPreview(); }

/* load current settings */
msg('Loading...');
database.ref('siteSettings').once('value').then(snap => {
    const v = snap.val() || {};
    const hero = Array.isArray(v.hero) ? v.hero : (v.hero ? Object.values(v.hero) : []);
    draft = { colors: v.colors || {}, hero: [hero[0]||'', hero[1]||'', hero[2]||''] };
    msg(''); render();
}).catch(e => { msg('Could not load: ' + e.message, true); render(); });

buildPresets();

$('saveBtn').addEventListener('click', function(){
    const b = this; b.disabled = true; msg('Saving...');
    database.ref('siteSettings').set({ colors: draft.colors, hero: draft.hero })
        .then(() => msg('Saved! Changes are live on the website.'))
        .catch(e => msg('Save failed: ' + e.message, true))
        .then(() => b.disabled = false);
});

$('resetBtn').addEventListener('click', function(){
    if(!confirm('Reset all colors and hero photos to the original design?')) return;
    const b = this; b.disabled = true; msg('Resetting...');
    database.ref('siteSettings').remove().then(() => {
        draft = { colors:{}, hero:['','',''] }; render(); msg('Reset to defaults.');
    }).catch(e => msg('Reset failed: ' + e.message, true)).then(() => b.disabled = false);
});
</script>
</body>
</html>
